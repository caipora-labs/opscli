[coding_agents.automations.resolve-ready-issues]
trigger_type = "issue"
repo = "acme/api"
query = "is:open label:agent-ready -linked:pr sort:created-asc"
# path = "~/code/api" # optional existing checkout or alternative clone destination
prompt = """
Resolve issue ${issue_number}: ${issue_title}

${issue_body}

Repository: ${repo}
URL: ${issue_url}
"""

[coding_agents.automations.review-pull-requests]
trigger_type = "github-cli-pull-requests"
repo = "acme/api"
query = "is:open label:review-needed"
profile = "claude-reviewer"
prompt = """
Review pull request ${pull_request_number}: ${pull_request_title}

${pull_request_body}

Repository: ${repo}
URL: ${pull_request_url}
Branch: ${pull_request_head_ref} -> ${pull_request_base_ref}
"""

[coding_agents.automations.review-azure-pull-requests]
trigger_type = "azure-cli-pull-requests"
repo = "contoso/api-project/api"
# status = "active"
# source_branch = "feature"
# target_branch = "main"
profile = "claude-reviewer"
prompt = """
Review pull request ${pull_request_number}: ${pull_request_title}

${pull_request_body}

Repository: ${repo}
URL: ${pull_request_url}
Branch: ${pull_request_head_ref} -> ${pull_request_base_ref}
"""

[coding_agents.automations.weekly-maintenance]
trigger_type = "cron"
repo = "acme/api"
schedule = "0 9 * * 1"
# timezone = "Europe/Rome" # overrides coding_agents.defaults.timezone
# start_date = 2026-10-05T00:00:00+02:00
# end_date = 2026-12-31T23:59:00+01:00
prompt = "Perform weekly maintenance for ${repo} (occurrence ${task_number})."

# Project queries retain open items and filter the board's Todo status.
# Add an independent automation using query = "project:owner/5" as needed.
